[package]
name = "am-cli"
version = "0.0.1"
edition = "2021"
description = "Antigravity Manager CLI"
default-run = "am"

[[bin]]
name = "am"
path = "src/main.rs"

[dependencies]
am-core = { path = "../am-core" }
clap = { version = "4.5", features = ["derive", "cargo"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
comfy-table = "7.1"
colored = "3.0"
indicatif = "0.17"
anyhow = "1.0"
uuid = { version = "1.10", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
open = "5.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
