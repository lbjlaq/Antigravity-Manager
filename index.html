<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity Tools</title>
  <script>
    (function () {
      try {
        const isMini = window.location.search.includes('mini') || 
                       (typeof window !== 'undefined' && window.__TAURI_INTERNALS__?.metadata?.currentWindow?.label === 'mini');
        if (isMini) {
          document.documentElement.classList.add('mini-window');
          document.documentElement.style.backgroundColor = 'transparent';
        } else {
          document.documentElement.style.backgroundColor = '#1a1f2e';
        }

        const savedTheme = localStorage.getItem('app-theme-preference');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        // Determine if should be dark for later use, but ALWAYS start with splash color
        const shouldBeDark = savedTheme === 'dark' || ((!savedTheme || savedTheme === 'system') && systemDark);

        if (shouldBeDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
        // Restore UI zoom immediately during boot
        const savedZoom = localStorage.getItem('app-ui-zoom');
        if (savedZoom) {
          const num = parseInt(savedZoom, 10);
          if (!isNaN(num) && num >= 50 && num <= 250) {
            if (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke) {
              window.__TAURI_INTERNALS__.invoke('plugin:webview|set_webview_zoom', { value: num / 100 }).catch(function() {
                document.documentElement.style.zoom = num + '%';
              });
            } else {
              document.documentElement.style.zoom = num + '%';
            }
          }
        }
      } catch (e) {
        console.error('Failed to apply theme during boot:', e);
      }
    })();
  </script>
  <style>
    /* Critical CSS: Force splash color initially for main window */
    html:not(.mini-window) {
      background-color: #1a1f2e !important;
    }

    html.mini-window,
    html.mini-window body,
    body.mini-window {
      background-color: transparent !important;
      background: transparent !important;
    }

    body {
      margin: 0;
      background-color: transparent;
    }
  </style>
</head>

<body style="margin: 0;">




  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
