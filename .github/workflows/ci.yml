name: CI

on:
  push:
    branches: [main, master, beta, antigravity-manager, 'feat/*']
  pull_request:
    branches: [main, master, beta, antigravity-manager]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: crates/am-gui/ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: crates/am-gui/ui
        run: npm install --legacy-peer-deps

      - name: TypeScript check
        working-directory: crates/am-gui/ui
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: crates/am-gui/ui
        run: npm run build

  check-rust:
    name: Check Rust Workspace
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-2025, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libsoup-3.0-dev javascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev
          sudo apt-get install -y --no-install-recommends libnm-dev xdg-utils

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}

      - name: Ensure frontend dist directory exists
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path crates/am-gui/ui/dist
          if (-not (Test-Path "crates/am-gui/ui/dist/index.html")) { Set-Content -Path "crates/am-gui/ui/dist/index.html" -Value "<html/>" }

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Check Rust compilation
        run: cargo check --workspace

  build-tauri:
    name: Build Tauri App & Sidecar
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-2025, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libsoup-3.0-dev javascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev
          sudo apt-get install -y --no-install-recommends libnm-dev xdg-utils

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        uses: taiki-e/install-action@cargo-tauri

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: crates/am-gui/ui/package-lock.json

      - name: Install and build frontend
        working-directory: crates/am-gui/ui
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Build and stage am CLI sidecar (debug)
        run: node scripts/prepare-sidecar.mjs --debug

      - name: Disable updater artifacts in unsigned CI builds
        shell: pwsh
        run: |
          $configPath = "crates/am-gui/src-tauri/tauri.conf.json"
          $config = Get-Content -Raw $configPath | ConvertFrom-Json
          $config.bundle.createUpdaterArtifacts = $false
          $config | ConvertTo-Json -Depth 32 | Set-Content -Path $configPath -Encoding UTF8
          Write-Host "Disabled updater artifacts for unsigned CI build."

      - name: Build Tauri app (debug)
        working-directory: crates/am-gui/src-tauri
        run: cargo tauri build --debug --no-bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
