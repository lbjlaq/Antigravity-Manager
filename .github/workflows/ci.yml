name: CI

on:
  push:
    branches: [main, master, beta, 'feat/*']
  pull_request:
    branches: [main, master, beta]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 前端构建检查
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

  # Rust 代码检查
  check-rust:
    name: Check Rust Code
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-2025, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libsoup-3.0-dev javascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev
          sudo apt-get install -y --no-install-recommends libnm-dev xdg-utils

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"
          save-if: ${{ github.event_name == 'push' }}

      - name: Ensure frontend dist directory exists
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          if (-not (Test-Path "dist/index.html")) { Set-Content -Path "dist/index.html" -Value "<html/>" }

      - name: Check Rust formatting
        run: |
          cd src-tauri
          cargo fmt -- --check

      - name: Run Clippy
        run: |
          cd src-tauri
          cargo clippy --all-targets --all-features

      - name: Compile critical-path Rust test binary
        timeout-minutes: 20
        run: |
          cd src-tauri
          cargo test --lib --no-run

      - name: Run critical-path Rust regression tests
        timeout-minutes: 5
        run: |
          cd src-tauri
          cargo test --lib -- --test-threads=1 models::official_model::tests models::account::tests modules::config::tests modules::integration::tests proxy::config::tests proxy::middleware::auth::tests proxy::common::model_mapping::tests proxy::common::model_gate::tests proxy::mappers::common_utils::tests proxy::tests::quota_protection proxy::tests::ultra_priority_tests utils::fs::tests utils::crypto::tests

      - name: Run admin & deep-health parity tests (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        timeout-minutes: 5
        run: |
          cd src-tauri
          cargo test --lib -- --test-threads=1 proxy::server::admin_parity_tests

      - name: Real-device verification advisory for OS-coupled or repeated-fix PRs
        if: github.event_name == 'pull_request' && startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: |
          git fetch --no-tags --depth=50 origin "${GITHUB_BASE_REF}" || true
          CHANGED_OS_FILES=$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" -- \
            src-tauri/src/modules/integration.rs \
            src-tauri/src/modules/process.rs \
            src-tauri/src/modules/tray.rs \
            src-tauri/src/modules/db.rs \
            src-tauri/src/commands/autostart.rs \
            src-tauri/src/linux_graphics.rs \
            src-tauri/src/linux_display_guard.rs 2>/dev/null || true)

          PR_REFS=$(git log --format=%s "origin/${GITHUB_BASE_REF}..HEAD" 2>/dev/null | grep -oE '#[0-9]+' | sort -u || true)
          REPEATED_ISSUES=""
          for ref in $PR_REFS; do
            PRIOR_HITS=$(git log -n 2 --oneline --grep="${ref}" "origin/${GITHUB_BASE_REF}" 2>/dev/null || true)
            if [ -n "$PRIOR_HITS" ]; then
              REPEATED_ISSUES="${REPEATED_ISSUES} ${ref}"
            fi
          done

          if [ -n "$CHANGED_OS_FILES" ] || [ -n "$REPEATED_ISSUES" ]; then
            echo "::warning title=Real-Device Verification Recommended::This PR touches OS-coupled code or revisits an already-patched issue (${REPEATED_ISSUES:-none}). Reproduce and verify the full behavior matrix on a real target host before merging."
            {
              echo "### Real-Device Verification Advisory"
              echo ""
              echo "CI cannot faithfully emulate macOS Keychain XARA partitions/ACLs, ad-hoc signing, locked keychains, or live client account switching."
              if [ -n "$REPEATED_ISSUES" ]; then
                echo "- **Previously patched issue reference(s) detected in base branch**: \`${REPEATED_ISSUES}\`"
              fi
              if [ -n "$CHANGED_OS_FILES" ]; then
                echo "- **OS/host-coupled files modified**:"
                echo "$CHANGED_OS_FILES" | sed 's/^/  - `/' | sed 's/$/`/'
              fi
              echo ""
              echo "Before merging, confirm: (1) root cause reproduced on a real host, (2) non-negotiable behavior invariants documented in code, and (3) full scenario matrix verified on real hardware."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # Tauri 构建测试（不打包）
  build-tauri:
    name: Build Tauri App
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-2025, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libsoup-3.0-dev javascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev
          sudo apt-get install -y --no-install-recommends libnm-dev xdg-utils

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"
          save-if: ${{ github.event_name == 'push' }}

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Disable updater artifacts in unsigned CI builds
        shell: pwsh
        run: |
          $configPath = "src-tauri/tauri.conf.json"
          $config = Get-Content -Raw $configPath | ConvertFrom-Json
          $config.bundle.createUpdaterArtifacts = $false
          $config | ConvertTo-Json -Depth 32 | Set-Content -Path $configPath -Encoding UTF8
          Write-Host "Disabled updater artifacts for unsigned CI build."

      - name: Build Tauri app (debug)
        run: npm run tauri build -- --debug --no-bundle
        env:
          # CI 环境不需要签名
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

  # Android ARM64 原生 Termux Headless 构建
  build-android-arm64:
    name: Build Android ARM64 Server (Termux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build frontend
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Build Android ARM64 headless server binary
        run: |
          cd src-tauri
          cargo ndk -t arm64-v8a build --release --bin antigravity-server

      - name: Package Android ARM64 artifact
        run: |
          mkdir -p dist-android
          cp src-tauri/target/aarch64-linux-android/release/antigravity-server dist-android/
          cp -r dist dist-android/dist
          tar -czvf antigravity-server-android-arm64.tar.gz -C dist-android antigravity-server dist

      - name: Upload Android ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-server-android-arm64
          path: antigravity-server-android-arm64.tar.gz
          if-no-files-found: error
