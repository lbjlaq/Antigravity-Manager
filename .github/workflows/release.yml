name: Release
on:
  push:
    tags:
      - "v*"
      - "am-v*"
      - "antigravity-manager"
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. antigravity-manager, v0.0.1-beta.1 on beta, or v0.0.1 on main). Leave empty to auto-detect.'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-release-target:
    name: Verify Branch & Release Type Compatibility
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.gate.outputs.release_tag }}
      app_version: ${{ steps.gate.outputs.app_version }}
      is_prerelease: ${{ steps.gate.outputs.is_prerelease }}
      is_am_channel: ${{ steps.gate.outputs.is_am_channel }}
      release_type: ${{ steps.gate.outputs.release_type }}
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and Validate Tag and Branch Alignment
        id: gate
        shell: bash
        run: |
          set -e

          PKG_VERSION=$(jq -r '.version' crates/am-gui/src-tauri/tauri.conf.json)
          DISPATCH_BRANCH="${{ github.ref_name }}"

          # 1. 确定本次发布的 Tag 名称
          INPUT_TAG="${{ github.event.inputs.release_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG_NAME="$INPUT_TAG"
            echo "Using manual input tag: $TAG_NAME"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            echo "Using git push tag: $TAG_NAME"
          elif [ "$DISPATCH_BRANCH" = "antigravity-manager" ]; then
            TAG_NAME="antigravity-manager"
            echo "Auto-resolved dedicated rolling tag for antigravity-manager branch: $TAG_NAME (v$PKG_VERSION)"
          else
            TAG_NAME="v${PKG_VERSION}"
            echo "Auto-resolved tag from tauri.conf.json: $TAG_NAME"
          fi

          # 2. 检查当前 commit 属于哪些远程分支
          CURRENT_COMMIT="${{ github.sha }}"
          BRANCHES=$(git branch -r --contains "$CURRENT_COMMIT" | sed 's/^[[:space:]]*origin\///' | tr '\n' ' ')
          echo "Commit $CURRENT_COMMIT belongs to remote branches: [ $BRANCHES ]"

          IS_AM_CHANNEL="false"
          if [ "$TAG_NAME" = "antigravity-manager" ] || [[ "$TAG_NAME" =~ ^am-v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            IS_AM_CHANNEL="true"
            IS_PRERELEASE="false"
            RELEASE_TYPE="am-channel"
            echo "📋 Release category: Dedicated Antigravity Manager Channel ($TAG_NAME / v$PKG_VERSION)"
          else
            if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              echo "::error::❌ Invalid tag format: '$TAG_NAME'. Must be 'antigravity-manager', 'am-vX.Y.Z', or SemVer 'vX.Y.Z[-beta.N]'!"
              exit 1
            fi

            if [[ "$TAG_NAME" == *-* ]]; then
              IS_PRERELEASE="true"
              RELEASE_TYPE="prerelease"
              echo "📋 Release category: Pre-release ($TAG_NAME)"
            else
              IS_PRERELEASE="false"
              RELEASE_TYPE="stable"
              echo "📋 Release category: Stable Release ($TAG_NAME)"
            fi

            # 严格通道隔离门禁 (Main 纯净正式版 / Beta 专属预发布版)
            if [ "$IS_PRERELEASE" = "true" ]; then
              if echo "$BRANCHES" | grep -qw "beta" || [ "$DISPATCH_BRANCH" = "beta" ]; then
                echo "✅ Pre-release verification passed: target is linked to 'beta' branch."
              else
                echo "::error::❌ [Release Gate Intercept] Pre-release tag '$TAG_NAME' (containing '-') is strictly forbidden on 'main' branch! Pre-releases must be published from the 'beta' branch to keep 'main' purely stable."
                exit 1
              fi
            else
              if echo "$BRANCHES" | grep -qw "main" || [ "$DISPATCH_BRANCH" = "main" ]; then
                echo "✅ Stable release verification passed: target is linked to 'main' branch."
              else
                echo "::error::❌ [Release Gate Intercept] Stable release tag '$TAG_NAME' (without '-') must be published from the 'main' branch! Please merge 'beta' into 'main' first."
                exit 1
              fi
            fi
          fi

          echo "release_tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "app_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "is_am_channel=$IS_AM_CHANNEL" >> "$GITHUB_OUTPUT"
          echo "release_type=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"

  build-tauri:
    needs: verify-release-target
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            sidecar_target: "aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            sidecar_target: "x86_64-apple-darwin"
          - platform: "macos-latest"
            args: "--target universal-apple-darwin --bundles app,dmg"
            sidecar_target: "universal-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
            sidecar_target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04-arm"
            args: ""
            sidecar_target: "aarch64-unknown-linux-gnu"
          - platform: "windows-2025"
            args: ""
            sidecar_target: "x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libsoup-3.0-dev javascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev
          sudo apt-get install -y libnm-dev xdg-utils

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Tauri CLI
        uses: taiki-e/install-action@cargo-tauri

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: crates/am-gui/ui/package-lock.json

      - name: Install and build frontend
        working-directory: crates/am-gui/ui
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Build and stage am CLI sidecar
        run: node scripts/prepare-sidecar.mjs --target ${{ matrix.sidecar_target }}

      - name: Disable updater artifacts without signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Host "Updater signing key is configured; keeping updater artifacts enabled."
            exit 0
          }

          $configPath = "crates/am-gui/src-tauri/tauri.conf.json"
          $config = Get-Content -Raw $configPath | ConvertFrom-Json
          $config.bundle.createUpdaterArtifacts = $false
          $config | ConvertTo-Json -Depth 32 | Set-Content -Path $configPath -Encoding UTF8
          Write-Host "No updater signing key configured; disabled updater artifacts for this build."

      # 预发布版本降级为仅 NSIS：WiX (MSI) 要求版本号预发布段为纯数字 (≤65535)，
      # 无法打包 SemVer 预发布串 (如 0.0.1-beta.1)；NSIS 无此限制。正式版保持默认 bundle 不变。
      - name: Skip MSI for prerelease tags
        if: matrix.platform == 'windows-2025' && needs.verify-release-target.outputs.is_prerelease == 'true'
        shell: pwsh
        run: |
          Write-Host "Prerelease version detected; MSI (WiX) cannot bundle SemVer prerelease versions. Falling back to NSIS only."
          "PRE_BUNDLE_ARGS=--bundles nsis" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build the app
        working-directory: crates/am-gui/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build ${{ matrix.args }} ${{ env.PRE_BUNDLE_ARGS }}

      # 处理 macOS 架构重命名冲突 (解决 422 Already Exists)
      - name: Rename macOS assets for architecture
        if: matrix.platform == 'macos-latest'
        run: |
          if [[ "${{ matrix.args }}" == *"--target aarch64-apple-darwin"* ]]; then
            ARCH="aarch64"
          elif [[ "${{ matrix.args }}" == *"--target x86_64-apple-darwin"* ]]; then
            ARCH="x64"
          elif [[ "${{ matrix.args }}" == *"--target universal-apple-darwin"* ]]; then
            ARCH="universal"
          else
            ARCH="unknown"
          fi

          echo "Detected architecture: $ARCH"

          MACOS_DIR="target/${{ matrix.sidecar_target }}/release/bundle/macos"
          if [ -d "$MACOS_DIR" ]; then
            cd "$MACOS_DIR"

            if [ -f "Antigravity Manager.app.tar.gz" ]; then
              mv "Antigravity Manager.app.tar.gz" "Antigravity Manager_${ARCH}.app.tar.gz"
              if [ -f "Antigravity Manager.app.tar.gz.sig" ]; then
                mv "Antigravity Manager.app.tar.gz.sig" "Antigravity Manager_${ARCH}.app.tar.gz.sig"
              fi
              echo "Renamed assets to append Arch: $ARCH"
            fi

            UPDATER_JSON="../../../updater/install.json"
            if [ ! -f "$UPDATER_JSON" ] && [ -d "../../../updater" ]; then
              UPDATER_JSON=$(find ../../../updater -name "*.json" | head -n 1)
            fi

            if [ -f "$UPDATER_JSON" ]; then
              echo "Updating $UPDATER_JSON to use renamed assets..."
              sed -i '' "s/Antigravity%20Manager.app.tar.gz/Antigravity%20Manager_${ARCH}.app.tar.gz/g" "$UPDATER_JSON"
            fi
          fi

      # 确保 Linux AppImage 包含标准 .DirIcon (解决 AppImageHub FATAL: .DirIcon is missing)
      - name: Verify and ensure AppImage .DirIcon compliance
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          for appimage in target/release/bundle/appimage/*.AppImage target/*/release/bundle/appimage/*.AppImage; do
            if [ -f "$appimage" ]; then
              echo "Inspecting AppImage: $appimage"
              chmod +x "$appimage"
              TMP_EXTRACT=$(mktemp -d)
              "$appimage" --appimage-extract > /dev/null 2>&1 || true
              if [ -d "squashfs-root" ]; then
                if [ ! -e "squashfs-root/.DirIcon" ] || [ ! -s "squashfs-root/.DirIcon" ]; then
                  echo "Warning: .DirIcon missing or broken in $appimage root! Fixing with 128x128.png..."
                  cp crates/am-gui/src-tauri/icons/128x128.png squashfs-root/.DirIcon
                  if command -v appimagetool >/dev/null 2>&1; then
                    appimagetool squashfs-root "$appimage"
                  elif [ -f "$HOME/.local/bin/appimagetool" ]; then
                    "$HOME/.local/bin/appimagetool" squashfs-root "$appimage"
                  fi
                else
                  echo "Verified: .DirIcon is present in $appimage."
                fi
                rm -rf squashfs-root
              fi
              rm -rf "$TMP_EXTRACT"
            fi
          done

      - name: Upload updater json
        uses: actions/upload-artifact@v4
        with:
          name: updater-json-${{ matrix.platform }}-${{ strategy.job-index }}
          path: target/**/release/bundle/updater/*.json
          if-no-files-found: ignore

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}-${{ strategy.job-index }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/appimage/*.AppImage
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/rpm/*.rpm
            target/**/release/bundle/macos/*.app.tar.gz
            target/**/release/bundle/macos/*.app.tar.gz.sig
            target/**/release/bundle/dmg/*.sig
            target/**/release/bundle/deb/*.sig
            target/**/release/bundle/appimage/*.sig
            target/**/release/bundle/msi/*.sig
            target/**/release/bundle/nsis/*.sig
            target/**/release/bundle/rpm/*.sig
          if-no-files-found: warn

  publish-release:
    needs: [verify-release-target, build-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: "{release-assets-*,updater-json-*}"
          merge-multiple: true

      - name: Extract Release Notes
        env:
          RELEASE_TAG: ${{ needs.verify-release-target.outputs.release_tag }}
          APP_VERSION: ${{ needs.verify-release-target.outputs.app_version }}
        run: |
          VER_HEADING="v${APP_VERSION}"
          echo "Extracting bilingual release notes for ${VER_HEADING} (tag: ${RELEASE_TAG}) from CHANGELOG.md"

          # 按字面精确匹配 `## vX.Y.Z` 标题（后面须为行尾或空白/括号，避免 v0.0.1 误匹配 v0.0.1-beta.1）
          EXTRACT_AWK='
            BEGIN { capture = 0; needle = "## " ver }
            {
              if (capture && $0 ~ /^##[[:space:]]+/) exit
              if (!capture && index($0, needle) == 1) {
                sep = substr($0, length(needle) + 1, 1)
                if (sep == "" || sep == " " || sep == "\t" || sep == "(") { capture = 1; next }
              }
            }
            capture { print }
          '

          > release_notes.md
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk -v ver="$VER_HEADING" "$EXTRACT_AWK" CHANGELOG.md)
            if [ -z "$NOTES" ] && [ "$RELEASE_TAG" != "$VER_HEADING" ]; then
              NOTES=$(awk -v ver="$RELEASE_TAG" "$EXTRACT_AWK" CHANGELOG.md)
            fi
            if [ -n "$NOTES" ]; then
              # 去掉首尾空行，保持 GitHub Release 与 updater.json 干净整洁
              printf '%s\n' "$NOTES" | awk 'NF { found=1 } found { lines[++n]=$0; last=NF ? n : last } END { for (i=1; i<=last; i++) print lines[i] }' > release_notes.md
            fi
          fi

          if [ ! -s release_notes.md ]; then
            echo "See the assets to download this version and install." > release_notes.md
          fi

          echo "Extracted release_notes.md:"
          cat release_notes.md

      - name: Collect and normalize release files
        run: |
          mkdir -p release-files
          find all-artifacts -type f \( \
            -name "*.dmg" -o \
            -name "*.deb" -o \
            -name "*.AppImage" -o \
            -name "*.msi" -o \
            -name "*.exe" -o \
            -name "*.rpm" -o \
            -name "*.tar.gz" -o \
            -name "*.sig" \
          \) -print0 | while IFS= read -r -d '' file; do
            cp "$file" release-files/
          done

          # 统一用点号替换文件名空格（避免 GitHub 自动改名造成冲突或上传双份冗余文件）
          cd release-files
          for f in *\ *; do
            [ -e "$f" ] || continue
            mv -f "$f" "${f// /.}"
          done

          # 为 Homebrew Cask 固定滚动通道生成无版本号规范别名（不影响版本号归档文件名）
          alias_first() {
            local pattern="$1"
            local target="$2"
            local found
            found=$(find . -maxdepth 1 -type f -name "$pattern" ! -name "$target" | head -n 1)
            if [ -n "$found" ] && [ -f "$found" ]; then
              cp -f "$found" "$target"
              echo "Created rolling alias: $target <- ${found#./}"
            fi
          }
          alias_first "*_aarch64.dmg" "Antigravity.Manager_aarch64.dmg"
          alias_first "*_x64.dmg" "Antigravity.Manager_x64.dmg"
          alias_first "*_universal.dmg" "Antigravity.Manager_universal.dmg"
          alias_first "*_amd64.AppImage" "Antigravity.Manager_amd64.AppImage"
          alias_first "*_aarch64.AppImage" "Antigravity.Manager_aarch64.AppImage"
          cd ..

          echo "Final staged release-files:"
          find release-files -maxdepth 1 -type f | sort

      - name: Build updater.json from real artifacts and signatures
        env:
          VERSION: ${{ needs.verify-release-target.outputs.release_tag }}
          APP_VERSION: ${{ needs.verify-release-target.outputs.app_version }}
          REPO: ${{ github.repository }}
        run: |
          DOWNLOAD_BASE="https://github.com/${REPO}/releases/download/${VERSION}"
          VER="${APP_VERSION}"

          # 按实际产物与签名文件动态匹配，彻底杜绝文件名写死导致的 404 或空签名崩溃
          find_asset_and_sig() {
            local pattern="$1"
            local bin_file sig_file
            bin_file=$(find release-files -maxdepth 1 -type f -name "$pattern" ! -name "*.sig" | sort | tail -n 1)
            if [ -n "$bin_file" ] && [ -f "${bin_file}.sig" ]; then
              sig_file="${bin_file}.sig"
              printf '%s\n%s' "$(basename "$bin_file")" "$(cat "$sig_file")"
            fi
          }

          PLATFORMS_JSON="{}"
          add_platform() {
            local key="$1"
            local pattern="$2"
            local pair bin_name sig_val
            pair=$(find_asset_and_sig "$pattern")
            if [ -n "$pair" ]; then
              bin_name=$(printf '%s' "$pair" | head -n 1)
              sig_val=$(printf '%s' "$pair" | tail -n +2)
              if [ -n "$bin_name" ] && [ -n "$sig_val" ]; then
                echo "  ${key}: OK (${bin_name})"
                PLATFORMS_JSON=$(jq -n \
                  --argjson cur "$PLATFORMS_JSON" \
                  --arg k "$key" \
                  --arg url "${DOWNLOAD_BASE}/${bin_name}" \
                  --arg sig "$sig_val" \
                  '$cur + {($k): {url: $url, signature: $sig}}')
                return
              fi
            fi
            echo "  ${key}: SKIPPED (binary or .sig missing)"
          }

          echo "Resolving updater platforms:"
          add_platform "darwin-aarch64" "*_aarch64.app.tar.gz"
          add_platform "darwin-x86_64" "*_x64.app.tar.gz"
          add_platform "windows-x86_64" "*_x64-setup.exe"
          add_platform "linux-x86_64" "*_${VER}_amd64.AppImage"
          add_platform "linux-aarch64" "*_${VER}_aarch64.AppImage"

          RELEASE_NOTES=$(cat release_notes.md)

          jq -n \
            --arg version "$VER" \
            --arg notes "$RELEASE_NOTES" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$PLATFORMS_JSON" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: $platforms
            }' > updater.json

          echo "Generated updater.json:"
          cat updater.json

      - name: Create or Update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          tag: ${{ needs.verify-release-target.outputs.release_tag }}
          name: "Antigravity Manager v${{ needs.verify-release-target.outputs.app_version }}"
          bodyFile: "release_notes.md"
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "release-files/*,updater.json"
          artifactErrorsFailBuild: false
          replacesArtifacts: true
          prerelease: ${{ needs.verify-release-target.outputs.is_prerelease == 'true' }}
          makeLatest: ${{ (needs.verify-release-target.outputs.is_prerelease == 'true' || needs.verify-release-target.outputs.is_am_channel == 'true') && 'false' || 'legacy' }}

      # 当通过归档版本 Tag (am-vX.Y.Z) 发布时，自动同步到固定滚动入口 `antigravity-manager`
      # 确保应用内更新器 (updater.json) 与 Homebrew Cask 始终能拉取到最新版本
      - name: Sync Rolling Antigravity Manager Channel (am-v* Tags)
        if: needs.verify-release-target.outputs.is_am_channel == 'true' && needs.verify-release-target.outputs.release_tag != 'antigravity-manager'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          tag: "antigravity-manager"
          name: "Antigravity Manager v${{ needs.verify-release-target.outputs.app_version }}"
          bodyFile: "release_notes.md"
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "release-files/*,updater.json"
          artifactErrorsFailBuild: false
          removeArtifacts: true
          replacesArtifacts: true
          prerelease: false
          makeLatest: false

      - name: Sync Preview Channel Release (Beta Only)
        if: needs.verify-release-target.outputs.is_prerelease == 'true'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          tag: "preview"
          name: "Antigravity Manager Preview Channel (${{ needs.verify-release-target.outputs.release_tag }})"
          body: "Preview Channel build for version ${{ needs.verify-release-target.outputs.release_tag }}. Automatically synced for in-app Beta updater."
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "release-files/*,updater.json"
          artifactErrorsFailBuild: false
          removeArtifacts: true
          replacesArtifacts: true
          prerelease: true
          makeLatest: false
