[package]
name = "antigravity-tools"
version = "4.7.3"
description = "Antigravity Tools"
authors = ["you"]
license = "CC-BY-NC-SA-4.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "antigravity_tools_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "^2.2.5", features = [] }

[dependencies]
tauri = { version = "^2.2.5", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = "0.4"
dirs = "5.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "socks", "blocking", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
base64 = "0.22"
sysinfo = "0.31"
sys-locale = "0.3.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs", "process"] }
url = "2.5.7"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"
image = { version = "0.25.9", default-features = false, features = ["png"] }
thiserror = "2.0.17"

# 反代服务依赖
axum = { version = "0.7", features = ["multipart", "ws"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
socket2 = { version = "0.5", features = ["all"] }

hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
eventsource-stream = "0.2"
dashmap = "6.1"
anyhow = "1.0"
futures = "0.3"
rand = "0.8"                        # 生成 sessionId 和 mock project_id
async-stream = "0.3.6"              # 简化异步流生成
regex = "1.12.2"                    # Duration 解析
once_cell = "1.19"                  # 静态初始化 (模型映射表)
pin-project = "1.1"                 # Pin 投影辅助
bytes = "1.5"                       # SSE 字节操作
tauri-plugin-single-instance = { version = "2.3.6", features = ["deep-link"] }
libc = "0.2"
tracing-appender = "0.2.4"
tracing-log = "0.2.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
sha2 = "0.10"
toml = "0.8"
toml_edit = "0.22"
tauri-plugin-window-state = "2"
parking_lot = "0.12.5"
tokio-util = "0.7.18"
aes-gcm = "0.10.3"
machine-uid = "0.5.4"
plist = "1.7"
rquest = { version = "5.1.0", features = ["json", "stream", "socks", "cookies"] }
rquest-util = "2.2.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3.10"

[profile.dev]
debug = 0              # 关闭开发模式的完整调试符号生成（杜绝产生几十 GB 的 .pdb 文件）
incremental = false    # 禁用开发模式增量编译缓存，避免磁盘无序膨胀

[profile.release]
opt-level = "z"        # 针对代码体积极限优化（比 s 更激进）
lto = "fat"            # 开启最激进的全局胖 LTO (Full Link-Time Optimization)，跨所有 crate 最大限度剔除未引用的死代码
codegen-units = 1      # 单代码生成单元，确保全局内联与极致死代码优化
panic = "abort"        # 遇到 panic 直接退出，移除整个庞大的栈回溯与展开表 (Stack Unwinding)
strip = true           # 自动剥离所有调试符号和符号表
debug = 0              # 彻底关闭中间依赖项的符号生成，大幅削减 target/release/deps 空间占用
incremental = false    # Release 模式不产生增量编译缓存碎片
