[package]
name = "antigravity-manager"
version = "5.0.4"
description = "Antigravity Manager"
authors = ["you"]
license = "CC-BY-NC-SA-4.0"
edition = "2021"
default-run = "antigravity-manager"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "antigravity_manager_lib"
crate-type = ["rlib"]

[[bin]]
name = "antigravity-manager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "^2.2.5", features = [] }

[dependencies]
tauri = { version = "^2.2.5", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
yaml-rt = { version = "0.3.1", default-features = false }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = "0.4"
dirs = "5.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "socks", "blocking", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
base64 = "0.22"
sysinfo = "0.31"
sys-locale = "0.3.2"
tokio = { version = "1", features = ["full"] }
url = "2.5.7"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"
image = { version = "0.25.9", default-features = false, features = ["png", "webp"] }
thiserror = "2.0.17"

dashmap = "6.1"
anyhow = "1.0"
futures = "0.3"
rand = "0.8"
regex = "1.12.2"
once_cell = "1.19"
libc = "0.2"
tracing-appender = "0.2.4"
tracing-log = "0.2.0"
tauri-plugin-updater = "2"
# Unify features for reqwest 0.13 used by tauri-plugin-updater to support SOCKS5 upstream proxy
reqwest_0_13 = { package = "reqwest", version = "0.13", default-features = false, features = ["socks"] }
tauri-plugin-process = "2"
sha2 = "0.10"
toml = "0.8"
toml_edit = "0.22"
parking_lot = "0.12.5"
tokio-util = "0.7.18"
aes-gcm = "0.10.3"
plist = "1.7"
rquest = { version = "5.1.0", features = ["json", "stream", "socks", "cookies"] }
rquest-util = "2.2.1"
time = { version = "0.3", features = ["formatting", "parsing"] }

[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
gtk = "0.18"

[target.'cfg(not(target_os = "android"))'.dependencies]
machine-uid = "0.5.4"
tauri-plugin-single-instance = { version = "2.3.6", features = ["deep-link"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-window-state = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1", features = ["test-util"] }
